name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Lint PHP API
        run: for f in public/api/*.php; do php -l "$f"; done
      # Upload this folder's contents to the domain's document root on Bluehost (public_html).
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          include-hidden-files: true
