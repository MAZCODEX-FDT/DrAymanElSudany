name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, fileinfo, gd
          tools: composer
      - run: npm ci
      - name: Test the Laravel API
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          php artisan test
      # Builds the site and the Laravel app, ready for Bluehost (see README, Deploy to Bluehost).
      - run: bash scripts/package-bluehost.sh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: bluehost-upload
          path: |
            build/bluehost/public_html.zip
            build/bluehost/drayman-app.zip
